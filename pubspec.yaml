name: parlour_management_app
description: Nupur Beauty Parlour (Only for ladies) management app for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Navigation
  go_router: ^17.2.3

  # Database
  sqflite: ^2.4.2+1

  # Code generation helpers
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # DI
  get_it: ^9.2.1

  # Google Drive backup
  googleapis: ^16.0.0
  google_sign_in: ^7.2.0
  http: ^1.2.2

  # Notifications
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

  # PDF & sharing
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^13.1.0

  # Image picker (customer photo)
  image_picker: ^1.1.2
  flutter_contacts: ^1.1.9+2

  # Utilities
  uuid: ^4.4.2
  intl: ^0.20.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  debounce_throttle: any
  url_launcher: ^6.3.2
  file_selector: ^1.1.0
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
